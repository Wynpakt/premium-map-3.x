services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cola
      MYSQL_USER: cola
      MYSQL_PASSWORD: cola
      MYSQL_ROOT_PASSWORD: r00tme
    ports:
      - "3316:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docs/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pr00tme"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"

  photon-de:
    profiles: ["photon"]
    build:
      context: ./docker/photon
    environment:
      PHOTON_COUNTRY: de
    ports:
      - "2322:2322"
    volumes:
      - photon_de:/photon/photon_data

  photon-at:
    profiles: ["photon"]
    build:
      context: ./docker/photon
    environment:
      PHOTON_COUNTRY: at
    ports:
      - "2323:2322"
    volumes:
      - photon_at:/photon/photon_data

  photon-ch:
    profiles: ["photon"]
    build:
      context: ./docker/photon
    environment:
      PHOTON_COUNTRY: ch
    ports:
      - "2324:2322"
    volumes:
      - photon_ch:/photon/photon_data

volumes:
  db_data:
  photon_de:
  photon_at:
  photon_ch:
