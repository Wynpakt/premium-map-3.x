<VirtualHost *:80>
    ServerName __API_HOST__
    DocumentRoot __APP_DIR__/public

    <Directory __APP_DIR__/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php?_url=/$1 [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/landkarte-api-error.log
    CustomLog ${APACHE_LOG_DIR}/landkarte-api-access.log combined
</VirtualHost>
