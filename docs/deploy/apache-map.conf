<VirtualHost *:80>
    ServerName __MAP_HOST__
    DocumentRoot __MAP_DIR__

    <Directory __MAP_DIR__>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        # /feedback/<id> is an Angular route, not a file on disk.
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/landkarte-map-error.log
    CustomLog ${APACHE_LOG_DIR}/landkarte-map-access.log combined
</VirtualHost>
